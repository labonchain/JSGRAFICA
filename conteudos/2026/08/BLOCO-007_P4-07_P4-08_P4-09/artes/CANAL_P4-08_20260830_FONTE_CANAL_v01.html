<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P4-08, Camisas personalizadas</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .campo-geometrico-1{
    position:absolute;top:0;left:0;right:0;
    height:320px;
    background:var(--azul-sistema);
  }
  .campo-geometrico-2{
    position:absolute;bottom:0;right:0;
    width:1080px;height:180px;
    background:var(--azul-sistema-claro);
  }
  .titulo{
    position:absolute;top:96px;left:0;right:0;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:58px;line-height:1.18;
    color:var(--branco-base);
  }
  .ilustracao{
    position:absolute;top:400px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .apoio{
    position:absolute;top:790px;left:140px;right:140px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--grafite-traco);
  }
  .cta{
    position:absolute;top:900px;left:0;right:0;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:28px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:44px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg.selo{width:52px;height:52px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="campo-geometrico-1"></div>
  <div class="campo-geometrico-2"></div>

  <div class="titulo">CAMISAS<br>PERSONALIZADAS</div>

  <div class="ilustracao">
    <!-- Silhueta propria de camiseta lisa, generica, sem marca/uniforme/personagem. -->
    <svg width="360" height="360" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <path d="M150,44 L118,66 L34,112 L70,192 L112,164 L112,362 L288,362 L288,164 L330,192 L366,112 L282,66 L250,44 C250,74 228,92 200,92 C172,92 150,74 150,44 Z"
        fill="var(--branco-base)" stroke="var(--grafite-traco)" stroke-width="4" stroke-linejoin="round"/>
      <!-- area grafica abstrata no peito, forma geometrica, nunca logo/foto de terceiro -->
      <g transform="translate(200,220)">
        <rect x="-50" y="-50" width="100" height="100" rx="16" fill="none" stroke="var(--azul-sistema)" stroke-width="5" stroke-dasharray="10 8"/>
        <circle cx="0" cy="0" r="30" fill="var(--laranja-pessego-escuro)"/>
      </g>
    </svg>
  </div>

  <div class="apoio">Converse com a equipe sobre a sua ideia.</div>

  <div class="cta">FALE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg class="selo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
