<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P4-07, Canecas personalizadas</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--azul-sistema);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .campo-topo{
    position:absolute;top:0;left:0;right:0;height:420px;
    background:var(--azul-sistema-escuro);
    border-radius:0 0 50% 50% / 0 0 120px 120px;
  }
  .titulo{
    position:absolute;top:230px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:66px;line-height:1.2;
    color:var(--branco-base);
  }
  .ilustracao{
    position:absolute;top:520px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .apoio{
    position:absolute;top:1280px;left:120px;right:120px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:36px;line-height:1.5;
    color:var(--branco-base);
  }
  .cta{
    position:absolute;top:1440px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:32px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:160px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:16px;
    background:var(--branco-base);
    border-radius:100px;
    padding:16px 32px;
  }
  .rodape-logo svg.selo{width:56px;height:56px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="campo-topo"></div>

  <div class="titulo">CANECAS<br>PERSONALIZADAS</div>

  <div class="ilustracao">
    <!-- Mesma mug generica do Canal, ampliada e recomposta para o formato vertical nativo. -->
    <svg width="620" height="620" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="200" cy="330" rx="120" ry="18" fill="var(--branco-base)" opacity="0.15"/>
      <path d="M92,80 L308,80 L296,330 Q294,352 272,352 L128,352 Q106,352 104,330 Z" fill="var(--branco-base)" stroke="var(--azul-sistema-escuro)" stroke-width="4"/>
      <ellipse cx="200" cy="80" rx="108" ry="16" fill="var(--branco-base)" stroke="var(--azul-sistema-escuro)" stroke-width="4"/>
      <path d="M296,140 C372,140 372,260 296,260" fill="none" stroke="var(--azul-sistema-escuro)" stroke-width="22" stroke-linecap="round"/>
      <circle cx="200" cy="220" r="46" fill="var(--laranja-pessego-escuro)"/>
      <rect x="150" y="170" width="100" height="100" rx="14" fill="none" stroke="var(--azul-sistema)" stroke-width="5" stroke-dasharray="10 8"/>
    </svg>
  </div>

  <div class="apoio">Para presentear, lembrar ou criar algo com a sua ideia.</div>

  <div class="cta">CONVERSE COM A EQUIPE</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente, sem recolorir, sobre placa branca pra manter a cor oficial legivel no fundo azul; unica aplicacao de marca da peca -->
      <svg class="selo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
