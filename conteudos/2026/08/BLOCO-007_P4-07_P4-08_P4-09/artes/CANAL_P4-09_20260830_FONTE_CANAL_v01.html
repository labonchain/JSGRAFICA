<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P4-09, Almofadas personalizadas</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .campo-geometrico-1{
    position:absolute;top:-120px;right:-120px;
    width:420px;height:420px;
    border-radius:50%;
    background:var(--azul-sistema-claro);
  }
  .campo-geometrico-2{
    position:absolute;bottom:0;left:0;
    width:1080px;height:120px;
    background:var(--azul-sistema);
  }
  .titulo{
    position:absolute;top:84px;left:0;right:0;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1.2;
    color:var(--azul-sistema-escuro);
  }
  .ilustracao{
    position:absolute;top:280px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .apoio{
    position:absolute;top:800px;left:140px;right:140px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--grafite-traco);
  }
  .cta{
    position:absolute;top:898px;left:0;right:0;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:26px;letter-spacing:1.2px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:32px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:12px;
    background:var(--branco-base);
    border-radius:100px;
    padding:10px 22px;
  }
  .rodape-logo svg.selo{width:44px;height:44px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="campo-geometrico-1"></div>
  <div class="campo-geometrico-2"></div>

  <div class="titulo">ALMOFADAS<br>PERSONALIZADAS</div>

  <div class="ilustracao">
    <!-- Mockup proprio de almofada lisa, estampa geometrica abstrata, sem rosto/texto de cliente. -->
    <svg width="440" height="440" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect x="60" y="60" width="280" height="280" rx="34" fill="var(--branco-base)" stroke="var(--grafite-traco)" stroke-width="4"/>
      <rect x="92" y="92" width="216" height="216" rx="22" fill="none" stroke="var(--cinza-nevoa)" stroke-width="3" stroke-dasharray="6 8"/>
      <!-- estampa geometrica abstrata, sem rosto/foto/marca de terceiro -->
      <polygon points="140,150 190,150 165,195" fill="var(--azul-sistema)"/>
      <polygon points="210,150 260,150 235,195" fill="var(--amarelo-aviso-escuro)"/>
      <polygon points="175,205 225,205 200,250" fill="var(--laranja-pessego-escuro)"/>
      <circle cx="200" cy="200" r="8" fill="var(--grafite-traco)"/>
    </svg>
  </div>

  <div class="apoio">Uma ideia sua pode virar presente.</div>

  <div class="cta">CHAME A EQUIPE PARA ORIENTAÇÃO</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir, sobre placa branca pra manter a cor oficial Azul Sistema legivel na faixa azul do rodape; unica aplicacao de marca da peca -->
      <svg class="selo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
