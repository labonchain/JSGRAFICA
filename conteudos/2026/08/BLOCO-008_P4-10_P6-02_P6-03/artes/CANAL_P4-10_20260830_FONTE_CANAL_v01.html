<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P4-10, Personalizados em cerâmica</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:78px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:58px;line-height:1.18;
    color:var(--grafite-traco);
  }
  .area-principal{
    position:absolute;top:280px;left:190px;width:700px;height:500px;
    background:var(--azul-sistema-claro);
    border-radius:32px;
  }
  .vasilha-sombra{
    position:absolute;left:50%;top:430px;transform:translateX(-50%);
    width:220px;height:36px;
    background:rgba(58,58,58,0.16);
    border-radius:50%;
    filter:blur(2px);
  }
  .vasilha{
    position:absolute;left:50%;top:120px;transform:translateX(-50%);
    width:280px;
  }
  .vasilha-gargalo{
    width:78px;height:36px;margin:0 auto;
    background:var(--branco-base);
    border:3px solid var(--grafite-traco);
    border-radius:50%;
  }
  .vasilha-corpo{
    width:280px;height:270px;margin-top:-6px;
    background:var(--branco-base);
    border:3px solid var(--grafite-traco);
    border-radius:46% 46% 50% 50% / 58% 58% 42% 42%;
    position:relative;
    overflow:hidden;
  }
  .detalhe-linha{
    position:absolute;left:-10px;right:-10px;top:118px;
    height:14px;
    border-top:4px dashed var(--laranja-pessego-escuro);
    transform:rotate(-4deg);
  }
  .detalhe-ponto{
    position:absolute;width:16px;height:16px;border-radius:50%;
    background:var(--amarelo-aviso-escuro);
  }
  .apoio{
    position:absolute;top:830px;left:140px;right:140px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--grafite-traco);
  }
  .cta{
    position:absolute;top:918px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:28px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:54px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg{width:52px;height:52px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">PERSONALIZADOS<br>EM CERÂMICA</div>

  <div class="area-principal">
    <div class="vasilha-sombra"></div>
    <div class="vasilha">
      <div class="vasilha-gargalo"></div>
      <div class="vasilha-corpo">
        <div class="detalhe-linha"></div>
        <div class="detalhe-ponto" style="top:60px;left:60px;"></div>
        <div class="detalhe-ponto" style="top:180px;right:54px;background:var(--azul-sistema);"></div>
      </div>
    </div>
  </div>

  <div class="apoio">Converse com a equipe sobre o item que você procura.</div>

  <div class="cta">FALE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
