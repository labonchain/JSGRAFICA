<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P4-10, Personalizados em cerâmica</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--azul-sistema-escuro);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:190px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:70px;line-height:1.2;
    color:var(--branco-base);
  }
  .vasilha-sombra{
    position:absolute;left:50%;top:1330px;transform:translateX(-50%);
    width:420px;height:56px;
    background:rgba(0,0,0,0.28);
    border-radius:50%;
    filter:blur(3px);
  }
  .vasilha{
    position:absolute;left:50%;top:480px;transform:translateX(-50%);
    width:540px;
  }
  .vasilha-gargalo{
    width:150px;height:68px;margin:0 auto;
    background:var(--branco-base);
    border:5px solid var(--branco-base);
    border-radius:50%;
  }
  .vasilha-corpo{
    width:540px;height:520px;margin-top:-10px;
    background:var(--branco-base);
    border:5px solid var(--branco-base);
    border-radius:46% 46% 50% 50% / 58% 58% 42% 42%;
    position:relative;
    overflow:hidden;
  }
  .detalhe-linha{
    position:absolute;left:-20px;right:-20px;top:230px;
    height:20px;
    border-top:7px dashed var(--laranja-pessego-escuro);
    transform:rotate(-4deg);
  }
  .detalhe-ponto{
    position:absolute;width:30px;height:30px;border-radius:50%;
    background:var(--amarelo-aviso-escuro);
  }
  .apoio{
    position:absolute;top:1440px;left:130px;right:130px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:36px;line-height:1.5;
    color:var(--branco-gelo);
  }
  .cta{
    position:absolute;top:1590px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:32px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:150px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:16px;
    background:var(--branco-base);
    border-radius:100px;
    padding:16px 32px;
  }
  .rodape-logo svg{width:56px;height:56px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">PERSONALIZADOS<br>EM CERÂMICA</div>

  <div class="vasilha-sombra"></div>
  <div class="vasilha">
    <div class="vasilha-gargalo"></div>
    <div class="vasilha-corpo">
      <div class="detalhe-linha"></div>
      <div class="detalhe-ponto" style="top:110px;left:110px;"></div>
      <div class="detalhe-ponto" style="top:340px;right:100px;background:var(--azul-sistema);"></div>
    </div>
  </div>

  <div class="apoio">Converse com a equipe sobre o item que você procura.</div>

  <div class="cta">FALE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir, sobre placa branca pra manter a cor oficial Azul Sistema legivel no fundo escuro; unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
