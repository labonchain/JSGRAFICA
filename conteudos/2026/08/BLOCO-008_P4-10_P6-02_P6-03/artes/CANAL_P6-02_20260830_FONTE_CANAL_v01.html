<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P6-02, Como pedir um personalizado</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:56px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:52px;line-height:1.18;
    color:var(--grafite-traco);
  }
  .passos{
    position:absolute;top:250px;left:100px;width:880px;
    display:flex;flex-direction:column;gap:28px;
  }
  .passo{
    display:flex;align-items:center;gap:32px;
    background:var(--branco-base);
    border-radius:26px;
    padding:38px 40px;
    box-shadow:0 10px 24px rgba(30,67,99,0.10);
  }
  .passo-icone{
    flex:none;width:100px;height:100px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .passo-icone svg{width:52px;height:52px;}
  .passo-corpo{flex:1;}
  .passo-numero{
    display:block;
    font-family:var(--font-dado);font-weight:500;font-size:19px;letter-spacing:1px;
    color:var(--amarelo-aviso-escuro);margin-bottom:8px;
  }
  .passo-texto{
    font-family:var(--font-display);font-weight:500;font-size:32px;line-height:1.25;
    color:var(--grafite-traco);
    text-transform:uppercase;
  }
  .cta{
    position:absolute;top:872px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:28px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:56px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg{width:48px;height:48px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">VAI PEDIR UM<br>PERSONALIZADO?</div>

  <div class="passos">
    <div class="passo">
      <div class="passo-icone" style="background:var(--azul-sistema-claro);">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--azul-sistema)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M12 2a7 7 0 0 0-4 12.6c.6.5 1 1.2 1 2.4h6c0-1.2.4-1.9 1-2.4A7 7 0 0 0 12 2z"/>
        </svg>
      </div>
      <div class="passo-corpo">
        <span class="passo-numero">PASSO 01</span>
        <span class="passo-texto">Qual item você procura?</span>
      </div>
    </div>
    <div class="passo">
      <div class="passo-icone" style="background:var(--azul-sistema-claro);">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--grafite-traco)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="8.5" cy="9.5" r="1.4"/>
          <path d="M21 15.5l-5-5-4 4-3-3-6 5.5"/>
        </svg>
      </div>
      <div class="passo-corpo">
        <span class="passo-numero">PASSO 02</span>
        <span class="passo-texto">Conte a ideia ou envie referência</span>
      </div>
    </div>
    <div class="passo">
      <div class="passo-icone" style="background:var(--azul-sistema-claro);">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--azul-sistema-escuro)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v12H8l-4 4V4z"/>
          <path d="M8 9h8M8 13h5"/>
        </svg>
      </div>
      <div class="passo-corpo">
        <span class="passo-numero">PASSO 03</span>
        <span class="passo-texto">A equipe orienta</span>
      </div>
    </div>
  </div>

  <div class="cta">FALE COM A EQUIPE DA JS</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
