  *{box-sizing:border-box}
  body{margin:0}
  :root{
    --azul:#2C5F8A; --azul-escuro:#1E4363; --azul-claro:#DCE8F0;
    --laranja:#E8935A; --laranja-escuro:#C96E36;
    --grafite:#3A3A3A; --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4; --branco:#FFFFFF; --branco-gelo:#F7F7F5;
    --amarelo:#F0B429; --amarelo-escuro:#8A5A0A;
  }
  .peca{
    width:1080px;height:1080px;background:var(--branco);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:64px;position:relative;overflow:hidden;
    font-family:'Inter',Arial,sans-serif;color:var(--grafite);
  }
  .conteudo{display:flex;flex-direction:column;align-items:center;gap:44px;flex:1;justify-content:center}
  .titulo{
    font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:66px;line-height:1.12;
    color:var(--grafite);text-align:center;max-width:860px;letter-spacing:-0.5px;
  }
  .apoio{font-size:32px;font-weight:400;color:var(--grafite-nevoa);text-align:center;max-width:700px}
  .pictos{display:flex;gap:44px;align-items:flex-start;justify-content:center}
  .picto-item{display:flex;flex-direction:column;align-items:center;gap:16px;width:176px}
  .picto-badge{
    width:176px;height:176px;border-radius:50%;background:var(--branco-gelo);
    display:flex;align-items:center;justify-content:center;
  }
  .picto-label{font-size:22px;font-weight:600;color:var(--grafite);text-align:center;letter-spacing:0.2px}
  .rodape{display:flex;flex-direction:column;align-items:center;gap:36px}
  .cta{
    font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:26px;letter-spacing:0.5px;
    background:var(--amarelo);color:var(--grafite);padding:20px 40px;border-radius:100px;text-align:center;
  }
  .logo{width:680px;height:auto;display:block}
</style>
