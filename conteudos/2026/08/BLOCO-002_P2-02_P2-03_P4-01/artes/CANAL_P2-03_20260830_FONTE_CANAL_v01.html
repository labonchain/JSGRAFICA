<style>
  *{box-sizing:border-box}
  body{margin:0}
  :root{
    --azul:#2C5F8A; --azul-escuro:#1E4363; --azul-claro:#DCE8F0;
    --laranja:#E8935A; --laranja-escuro:#C96E36;
    --grafite:#3A3A3A; --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4; --branco:#FFFFFF; --branco-gelo:#F7F7F5;
    --amarelo:#F0B429; --amarelo-escuro:#8A5A0A;
  }
  .peca{
    width:1080px;height:1080px;background:var(--azul);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:64px;position:relative;overflow:hidden;
    font-family:'Inter',Arial,sans-serif;color:var(--branco);
  }
  .conteudo{display:flex;flex-direction:column;align-items:center;gap:48px;flex:1;justify-content:center}
  .titulo{
    font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:64px;line-height:1.15;
    color:var(--branco);text-align:center;max-width:820px;letter-spacing:-0.5px;
  }
  .blocos{display:flex;gap:40px;justify-content:center}
  .bloco{
    background:var(--branco-gelo);border-radius:28px;width:270px;padding:40px 28px;
    display:flex;flex-direction:column;align-items:center;gap:24px;
  }
  .bloco-badge{width:96px;height:96px;display:flex;align-items:center;justify-content:center}
  .bloco-label{font-family:'Inter',Arial,sans-serif;font-weight:600;font-size:24px;color:var(--grafite);text-align:center;letter-spacing:0.4px}
  .rodape{display:flex;flex-direction:column;align-items:center;gap:36px}
  .cta{
    font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:25px;letter-spacing:0.4px;
    background:var(--amarelo);color:var(--grafite);padding:20px 36px;border-radius:100px;text-align:center;
  }
  .lockup{display:flex;align-items:center;gap:24px}
  .lockup .nome{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:40px;color:var(--branco);letter-spacing:0.3px}
</style>
</helmet>
