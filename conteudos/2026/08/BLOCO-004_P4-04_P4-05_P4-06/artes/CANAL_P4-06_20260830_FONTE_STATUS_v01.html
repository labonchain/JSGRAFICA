<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P4-06, Presentes personalizados</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:150px;left:80px;right:80px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:76px;line-height:1.18;
    color:var(--grafite-traco);
  }
  .acento{
    position:absolute;top:368px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .acento span{
    width:130px;height:7px;border-radius:4px;
    background:var(--laranja-pessego-escuro);
    display:block;
  }
  .colecao{
    position:absolute;top:432px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:26px;
  }
  .modulo{
    width:760px;height:224px;
    background:var(--azul-sistema);
    border-radius:26px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 36px rgba(30,67,99,0.20);
  }
  .modulo:nth-child(odd){transform:translateX(-34px);}
  .modulo:nth-child(even){transform:translateX(34px);}
  .modulo svg{width:150px;height:150px;}
  .apoio{
    position:absolute;top:1470px;left:120px;right:120px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:36px;line-height:1.55;
    color:var(--grafite-traco);
  }
  .cta{
    position:absolute;top:1608px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:32px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:110px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:16px;
  }
  .rodape-logo svg.marca{width:58px;height:58px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">PRESENTE BOM<br>TEM HISTÓRIA.</div>

  <div class="acento"><span></span></div>

  <div class="colecao">
    <div class="modulo" aria-label="caneca">
      <svg viewBox="0 0 100 100" fill="none">
        <rect x="20" y="28" width="52" height="54" rx="8" stroke="#FFFFFF" stroke-width="6"/>
        <path d="M72 40 Q92 40 92 56 Q92 72 72 72" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
        <line x1="28" y1="40" x2="64" y2="40" stroke="#DCE8F0" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="modulo" aria-label="camisa">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M31 18 L14 29 L25 46 L31 41 L31 84 L69 84 L69 41 L75 46 L86 29 L69 18 Q60 27 50 27 Q40 27 31 18 Z" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="modulo" aria-label="item em ceramica">
      <svg viewBox="0 0 100 100" fill="none">
        <ellipse cx="50" cy="20" rx="16" ry="5" stroke="#FFFFFF" stroke-width="6"/>
        <path d="M38 22 L34 40 Q26 55 30 68 Q34 84 50 84 Q66 84 70 68 Q74 55 66 40 L62 22" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="modulo" aria-label="almofada">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M30 20 C42 4 58 4 70 20 C88 30 88 70 70 80 C58 96 42 96 30 80 C12 70 12 30 30 20 Z" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="5" fill="#FFFFFF"/>
      </svg>
    </div>
  </div>

  <div class="apoio">Personalizados para presentear e guardar lembranças.</div>

  <div class="cta">CONTE SUA IDEIA PARA A EQUIPE</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir; unica aplicacao de marca da peca -->
    <svg class="marca" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
