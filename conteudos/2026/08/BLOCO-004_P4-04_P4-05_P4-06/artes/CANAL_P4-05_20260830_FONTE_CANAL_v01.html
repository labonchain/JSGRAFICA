<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P4-05, Topo de bolo</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-base);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:70px;left:80px;right:80px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1.22;
    color:var(--grafite-traco);
  }
  .painel{
    position:absolute;top:246px;left:110px;width:860px;height:520px;
    background:var(--azul-sistema);
    border-radius:32px;
    box-shadow:0 22px 50px rgba(14,35,54,0.22);
    overflow:hidden;
  }
  .confete{position:absolute;}
  .confete.estrela{
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .confete.diamante{transform:rotate(45deg);border-radius:4px;}
  .confete.triangulo{
    width:0;height:0;background:transparent !important;
    border-left:30px solid transparent;
    border-right:30px solid transparent;
    border-bottom:52px solid var(--branco-base);
  }
  .topo-bolo{position:absolute;left:0;top:0;width:100%;height:100%;}
  .topo-estrela{
    position:absolute;top:60px;left:325px;width:210px;height:210px;
    background:var(--branco-base);
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .topo-conta{
    position:absolute;top:187px;left:417px;width:26px;height:26px;
    background:var(--amarelo-aviso-escuro);
    border-radius:50%;
  }
  .topo-haste{
    position:absolute;top:200px;left:421px;width:18px;height:230px;
    background:var(--branco-base);
    border-radius:9px;
  }
  .apoio{
    position:absolute;top:800px;left:100px;right:100px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:32px;
    color:var(--grafite-traco);
  }
  .cta{
    position:absolute;top:868px;left:100px;right:100px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:26px;letter-spacing:1.5px;
    color:var(--amarelo-aviso-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:56px;left:0;right:0;
    display:flex;align-items:center;justify-content:center;gap:14px;
  }
  .rodape-logo svg{width:42px;height:42px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:0.5px;
    color:var(--azul-sistema);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">A FESTA TAMBÉM TEM<br>O SEU TOQUE.</div>

  <div class="painel">
    <div class="topo-bolo">
      <!-- confete: estrelas e formas geometricas soltas, decorativas, sem texto -->
      <div class="confete estrela" style="top:60px;left:100px;width:56px;height:56px;background:var(--amarelo-aviso-escuro);transform:rotate(-10deg);"></div>
      <div class="confete estrela" style="top:392px;left:686px;width:46px;height:46px;background:var(--branco-base);opacity:0.9;transform:rotate(18deg);"></div>
      <div class="confete" style="top:120px;left:730px;width:30px;height:30px;background:var(--branco-base);border-radius:50%;"></div>
      <div class="confete" style="top:410px;left:130px;width:24px;height:24px;background:var(--amarelo-aviso-escuro);border-radius:50%;"></div>
      <div class="confete diamante" style="top:230px;left:70px;width:34px;height:34px;background:var(--branco-base);opacity:0.85;"></div>
      <div class="confete diamante" style="top:56px;left:600px;width:38px;height:38px;background:var(--amarelo-aviso-escuro);"></div>
      <div class="confete triangulo" style="top:300px;left:748px;transform:rotate(8deg);"></div>
      <div class="confete estrela" style="top:436px;left:330px;width:32px;height:32px;background:var(--amarelo-aviso-escuro);transform:rotate(-6deg);"></div>

      <div class="topo-estrela"></div>
      <div class="topo-conta"></div>
      <div class="topo-haste"></div>
    </div>
  </div>

  <div class="apoio">Topo de bolo para sua comemoração.</div>

  <div class="cta">FALE COM A EQUIPE SOBRE SUA IDEIA.</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente, sem recolorir; unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
