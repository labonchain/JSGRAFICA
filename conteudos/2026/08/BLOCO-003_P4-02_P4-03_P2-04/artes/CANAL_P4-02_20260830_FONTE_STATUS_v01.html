<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P4-02, Cartão de visita</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--azul-sistema-escuro);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:200px;left:90px;width:900px;
    text-align:center;left:0;right:0;margin:0 auto;
    font-family:var(--font-display);font-weight:700;font-size:74px;line-height:1.18;
    color:var(--branco-base);
  }
  .ilustracao{
    position:absolute;top:440px;left:90px;width:900px;height:900px;
  }
  .cartao{
    position:absolute;
    width:660px;height:400px;
    background:var(--branco-base);
    border-radius:22px;
    box-shadow:0 26px 60px rgba(0,0,0,0.28);
  }
  .cartao-tras{
    top:40px;left:60px;
    transform:rotate(-6deg);
  }
  .cartao-frente{
    top:280px;left:200px;
    transform:rotate(4deg);
    padding:56px;
  }
  .linha-bloco{
    background:var(--azul-sistema);
    border-radius:8px;
    height:20px;
  }
  .linha-bloco.curta{width:45%;background:var(--laranja-pessego-escuro);margin-top:26px;}
  .linha-bloco.media{width:70%;margin-top:20px;}
  .linha-bloco.longa{width:88%;margin-top:44px;height:14px;background:var(--cinza-nevoa);}
  .linha-bloco.longa2{width:60%;margin-top:14px;height:14px;background:var(--cinza-nevoa);}
  .ponto-canto{
    position:absolute;
    width:16px;height:16px;border-radius:50%;
    background:var(--amarelo-aviso);
  }
  .apoio{
    position:absolute;top:1460px;left:120px;right:120px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:34px;line-height:1.5;
    color:var(--branco-gelo);
  }
  .cta{
    position:absolute;top:1580px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:30px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:150px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:16px;
    background:var(--branco-base);
    border-radius:100px;
    padding:16px 32px;
  }
  .rodape-logo svg{width:56px;height:56px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">SEU CONTATO<br>MERECE FICAR.</div>

  <div class="ilustracao">
    <div class="cartao cartao-tras">
      <div class="ponto-canto" style="top:22px;left:22px;"></div>
      <div class="ponto-canto" style="top:22px;right:22px;"></div>
      <div class="ponto-canto" style="bottom:22px;left:22px;"></div>
      <div class="ponto-canto" style="bottom:22px;right:22px;"></div>
    </div>
    <div class="cartao cartao-frente">
      <div class="linha-bloco media"></div>
      <div class="linha-bloco curta"></div>
      <div class="linha-bloco longa"></div>
      <div class="linha-bloco longa2"></div>
    </div>
  </div>

  <div class="apoio">Cartão de visita para profissionais e negócios locais.</div>

  <div class="cta">CONTE SUA IDEIA PARA A EQUIPE</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir, sobre placa branca pra manter a cor oficial Azul Sistema legivel no fundo escuro; unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
