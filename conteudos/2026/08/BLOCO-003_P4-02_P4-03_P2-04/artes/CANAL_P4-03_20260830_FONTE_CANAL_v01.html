<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P4-03, Panfletos</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--azul-sistema);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:64px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:52px;line-height:1.18;
    color:var(--branco-base);
  }
  .area-principal{
    position:absolute;top:250px;left:100px;width:880px;height:560px;
    background:var(--branco-gelo);
    border-radius:28px;
    box-shadow:0 22px 50px rgba(14,35,54,0.28);
  }
  .folha{
    position:absolute;
    width:300px;height:400px;
    background:var(--branco-base);
    border-radius:14px;
    box-shadow:0 12px 26px rgba(30,67,99,0.18);
    overflow:hidden;
  }
  .folha .faixa{width:100%;height:96px;}
  .folha .linha{margin:16px 24px;border-radius:6px;height:12px;background:var(--cinza-nevoa);}
  .folha .linha.curta{width:45%;}
  .folha-a{top:70px;left:60px;transform:rotate(-9deg);}
  .folha-a .faixa{background:var(--azul-sistema);}
  .folha-b{top:60px;left:290px;transform:rotate(2deg);}
  .folha-b .faixa{background:var(--laranja-pessego);}
  .folha-c{top:95px;left:520px;transform:rotate(9deg);}
  .folha-c .faixa{background:var(--amarelo-aviso-escuro);}
  .apoio{
    position:absolute;top:850px;left:100px;right:100px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:28px;
    color:var(--branco-base);
  }
  .cta{
    position:absolute;top:912px;left:100px;right:100px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:26px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:54px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:14px;
    background:var(--branco-base);
    border-radius:100px;
    padding:12px 26px;
  }
  .rodape-logo svg{width:44px;height:44px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">UMA MENSAGEM<br>CLARA CHEGA MELHOR.</div>

  <div class="area-principal">
    <div class="folha folha-a">
      <div class="faixa"></div>
      <div class="linha"></div>
      <div class="linha curta"></div>
      <div class="linha"></div>
    </div>
    <div class="folha folha-b">
      <div class="faixa"></div>
      <div class="linha"></div>
      <div class="linha curta"></div>
      <div class="linha"></div>
    </div>
    <div class="folha folha-c">
      <div class="faixa"></div>
      <div class="linha"></div>
      <div class="linha curta"></div>
      <div class="linha"></div>
    </div>
  </div>

  <div class="apoio">Panfletos para comunicar o que você precisa.</div>

  <div class="cta">MANDE SUA IDEIA PARA A EQUIPE</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente, sem recolorir; unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
