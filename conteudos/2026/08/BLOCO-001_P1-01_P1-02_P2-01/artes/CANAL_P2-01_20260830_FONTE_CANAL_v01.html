<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .canal-1080 {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: #FFFFFF;
    overflow: hidden;
    font-family: 'Inter', Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .top-zone {
    flex: none;
    height: 616px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 70px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: 0.16em;
    color: #6B6B6B;
    text-transform: uppercase;
    margin: 0 0 22px 0;
  }
  .title {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1.08;
    color: #3A3A3A;
    margin: 0;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .benefit {
    font-family: 'Inter', Arial, sans-serif;
    font-weight: 400;
    font-size: 27px;
    line-height: 1.4;
    color: #3A3A3A;
    text-align: center;
    margin: 26px 0 0 0;
    max-width: 620px;
  }
  .pictogram-wrap {
    margin-top: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bottom-zone {
    flex: 1 1 auto;
    background: #2C5F8A;
    border-radius: 56px 56px 0 0;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bottom-dotgrid {
    position: absolute;
    top: 40px; left: 44px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 13px;
  }
  .bottom-dotgrid span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #F0B429;
    display: block;
  }
  .cta-label {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.14em;
    color: #FFFFFF;
    text-transform: uppercase;
    margin: 0 0 16px 0;
  }
  .cta-text {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: 0.01em;
    color: #FFFFFF;
    text-align: center;
    line-height: 1.3;
    margin: 0;
  }
  .footer-row {
    margin-top: 46px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footer-logo { width: 36px; height: 36px; flex: none; }
  .footer-word {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 700;
    font-size: 21px;
    color: #FFFFFF;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<x-dc>
  <div class="canal-1080">
    <div class="top-zone">
      <p class="eyebrow">Impressão e xerox</p>
      <h1 class="title">IMPRIMIR OU<br>TIRAR XEROX?</h1>
      <p class="benefit">Traga ou envie seu arquivo e fale com a equipe.</p>
      <div class="pictogram-wrap">
        <svg width="184" height="184" viewBox="0 0 184 184" fill="none">
          <g stroke="#6B6B6B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
            <rect x="26" y="34" width="112" height="140" rx="10" fill="#F7F7F5"/>
            <path d="M50 66H114M50 88H114M50 110H92" />
          </g>
          <g stroke="#C96E36" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
            <rect x="46" y="10" width="112" height="140" rx="10" fill="#FFFFFF"/>
            <path d="M70 42H144M70 64H144M70 86H122" />
          </g>
        </svg>
      </div>
    </div>
    <div class="bottom-zone">
      <div class="bottom-dotgrid">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="cta-label">Como pedir</p>
      <p class="cta-text">PEÇA ORIENTAÇÃO<br>PELO WHATSAPP</p>
      <div class="footer-row">
        <svg class="footer-logo" viewBox="0 0 24 24">
          <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#FFFFFF"/>
        </svg>
        <span class="footer-word">JS GRÁFICA · IBURA, RECIFE</span>
      </div>
    </div>
  </div>
</x-dc>
</body>
</html>
