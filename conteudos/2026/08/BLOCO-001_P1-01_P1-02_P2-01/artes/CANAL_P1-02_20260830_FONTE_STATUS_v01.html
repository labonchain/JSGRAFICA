<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .status-1080x1920 {
    width: 1080px;
    height: 1920px;
    position: relative;
    background: #F7F7F5;
    overflow: hidden;
    font-family: 'Inter', Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .safe-top { flex: none; height: 176px; }
  .safe-bottom { flex: none; height: 224px; }

  .card {
    margin: 0 64px;
    flex: none;
    background: #1E4363;
    border-radius: 36px;
    padding: 56px 56px 60px 56px;
    position: relative;
    overflow: hidden;
  }
  .card-shade {
    position: absolute;
    top: 0; right: 0;
    width: 46%;
    height: 100%;
    background: #2C5F8A;
    opacity: 0.5;
    clip-path: polygon(48% 0, 100% 0, 100% 100%, 8% 100%);
  }
  .dotgrid {
    position: absolute;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 14px;
    top: 40px; right: 40px;
  }
  .dotgrid span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #F0B429;
    display: block;
  }
  .eyebrow-w {
    position: relative;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.14em;
    color: #F0B429;
    text-transform: uppercase;
    margin: 0 0 22px 0;
  }
  .title-w {
    position: relative;
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 700;
    font-size: 70px;
    line-height: 1.1;
    color: #FFFFFF;
    margin: 0;
    letter-spacing: -0.01em;
    max-width: 640px;
  }
  .title-rule-w {
    position: relative;
    width: 140px;
    height: 7px;
    background: #E8935A;
    border-radius: 4px;
    margin-top: 34px;
  }

  .steps {
    margin: 108px 64px 0 64px;
    display: flex;
    flex-direction: column;
    gap: 96px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 34px;
  }
  .step-num {
    flex: none;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 3px solid #1E4363;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 700;
    font-size: 38px;
    color: #1E4363;
  }
  .step-icon {
    flex: none;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border: 2px solid #E4E4E4;
  }
  .step-icon svg { width: 46px; height: 46px; }
  .step-text {
    font-family: 'Inter', Arial, sans-serif;
    font-weight: 600;
    font-size: 37px;
    line-height: 1.32;
    color: #3A3A3A;
    max-width: 700px;
  }

  .spacer { flex: 1 1 auto; max-height: 300px; }

  .cta-pill {
    margin: 0 64px;
    display: flex;
    align-items: center;
    gap: 22px;
    background: #FFFFFF;
    border: 1.5px solid #E4E4E4;
    border-radius: 999px;
    padding: 28px 38px;
    width: fit-content;
  }
  .cta-dot {
    width: 26px; height: 26px; border-radius: 50%;
    background: #25A35A;
    flex: none;
  }
  .cta-text {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 27px;
    letter-spacing: 0.02em;
    color: #1E4363;
  }
  .footer-row {
    margin: 34px 64px 0 64px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footer-logo { width: 42px; height: 42px; flex: none; }
  .footer-word {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: #3A3A3A;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<x-dc>
  <div class="status-1080x1920">
    <div class="safe-top"></div>

    <div class="card">
      <div class="card-shade"></div>
      <div class="dotgrid">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="eyebrow-w">Canal JS Gráfica</p>
      <h1 class="title-w">PRECISA RESOLVER<br>ALGUMA COISA?</h1>
      <div class="title-rule-w"></div>
    </div>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path d="M4 5.5C4 4.7 4.7 4 5.5 4H18.5C19.3 4 20 4.7 20 5.5V14.5C20 15.3 19.3 16 18.5 16H9.5L6 19.5V16H5.5C4.7 16 4 15.3 4 14.5V5.5Z" stroke="#2C5F8A" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M7.6 8.4H16.4M7.6 11.4H13" stroke="#2C5F8A" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="step-text">Conte o que precisa.</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path d="M7 3.6H14.2L18 7.4V19.4C18 20.1 17.4 20.6 16.7 20.6H7C6.3 20.6 5.7 20.1 5.7 19.4V4.8C5.7 4.1 6.3 3.6 7 3.6Z" stroke="#C96E36" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M14.2 3.6V7.4H18" stroke="#C96E36" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M8.4 12.2H15.3M8.4 15.2H15.3M8.4 18H12.5" stroke="#C96E36" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="step-text">Envie o arquivo ou uma<br>foto, quando tiver.</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path d="M4 19.4V18.2C4 15.9 6.7 14 10 14C13.3 14 16 15.9 16 18.2V19.4" stroke="#8A5A0A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="8.6" r="3.4" stroke="#8A5A0A" stroke-width="1.7"/>
            <path d="M17.4 9.4C18.9 9.4 20 10.6 20 12" stroke="#8A5A0A" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M2.8 21H21.2" stroke="#8A5A0A" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="step-text">A equipe confirma o<br>atendimento com você.</div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="cta-pill">
      <span class="cta-dot"></span>
      <span class="cta-text">CHAME A JS GRÁFICA NO WHATSAPP</span>
    </div>
    <div class="footer-row">
      <svg class="footer-logo" viewBox="0 0 24 24">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span class="footer-word">JS GRÁFICA · IBURA, RECIFE</span>
    </div>

    <div class="safe-bottom"></div>
  </div>
</x-dc>
</body>
</html>
