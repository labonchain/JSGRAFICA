<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .canal-1080 {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: #F7F7F5;
    overflow: hidden;
    font-family: 'Inter', Arial, sans-serif;
  }
  .stripe {
    position: absolute;
    top: 0; right: 0;
    width: 248px;
    height: 1080px;
    background: #1E4363;
  }
  .stripe-shade {
    position: absolute;
    top: 0; right: 0;
    width: 128px;
    height: 1080px;
    background: #2C5F8A;
    opacity: 0.55;
    clip-path: polygon(40% 0, 100% 0, 100% 100%, 0% 100%);
  }
  .dotgrid {
    position: absolute;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 14px;
  }
  .dotgrid span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #F0B429;
    display: block;
  }
  .content {
    position: absolute;
    left: 64px;
    top: 0;
    width: 720px;
    height: 1080px;
    display: flex;
    flex-direction: column;
  }
  .title-block {
    margin-top: 76px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.14em;
    color: #C96E36;
    text-transform: uppercase;
    margin: 0 0 18px 0;
  }
  .title {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 700;
    font-size: 62px;
    line-height: 1.08;
    color: #3A3A3A;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .title-rule {
    width: 118px;
    height: 6px;
    background: #C96E36;
    border-radius: 3px;
    margin-top: 28px;
  }
  .steps {
    margin-top: 64px;
    display: flex;
    flex-direction: column;
    gap: 48px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .step-num {
    flex: none;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 2.5px solid #1E4363;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 700;
    font-size: 32px;
    color: #1E4363;
  }
  .step-icon {
    flex: none;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border: 2px solid #E4E4E4;
  }
  .step-icon svg { width: 38px; height: 38px; }
  .step-text {
    font-family: 'Inter', Arial, sans-serif;
    font-weight: 600;
    font-size: 31px;
    line-height: 1.3;
    color: #3A3A3A;
  }
  .spacer { flex: 1 1 auto; max-height: 90px; }
  .cta-pill {
    display: flex;
    align-items: center;
    gap: 18px;
    background: #FFFFFF;
    border: 1.5px solid #E4E4E4;
    border-radius: 999px;
    padding: 20px 30px;
    width: fit-content;
  }
  .cta-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: #25A35A;
    flex: none;
  }
  .cta-text {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: #1E4363;
  }
  .footer-row {
    margin-top: 26px;
    margin-bottom: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer-logo { width: 34px; height: 34px; flex: none; }
  .footer-word {
    font-family: 'Space Grotesk', Arial, sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #3A3A3A;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<x-dc>
  <div class="canal-1080">
    <div class="stripe">
      <div class="stripe-shade"></div>
      <div class="dotgrid" style="top:56px; right:44px;">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="content">
      <div class="title-block">
        <p class="eyebrow">Canal JS Gráfica</p>
        <h1 class="title">PRECISA<br>RESOLVER<br>ALGUMA COISA?</h1>
        <div class="title-rule"></div>
      </div>
      <div class="steps">
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
              <path d="M4 5.5C4 4.7 4.7 4 5.5 4H18.5C19.3 4 20 4.7 20 5.5V14.5C20 15.3 19.3 16 18.5 16H9.5L6 19.5V16H5.5C4.7 16 4 15.3 4 14.5V5.5Z" stroke="#2C5F8A" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M7.6 8.4H16.4M7.6 11.4H13" stroke="#2C5F8A" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="step-text">Conte o que precisa.</div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
              <path d="M7 3.6H14.2L18 7.4V19.4C18 20.1 17.4 20.6 16.7 20.6H7C6.3 20.6 5.7 20.1 5.7 19.4V4.8C5.7 4.1 6.3 3.6 7 3.6Z" stroke="#C96E36" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M14.2 3.6V7.4H18" stroke="#C96E36" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M8.4 12.2H15.3M8.4 15.2H15.3M8.4 18H12.5" stroke="#C96E36" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="step-text">Envie o arquivo ou uma foto,<br>quando tiver.</div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
              <path d="M4 19.4V18.2C4 15.9 6.7 14 10 14C13.3 14 16 15.9 16 18.2V19.4" stroke="#8A5A0A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="10" cy="8.6" r="3.4" stroke="#8A5A0A" stroke-width="1.7"/>
              <path d="M17.4 9.4C18.9 9.4 20 10.6 20 12" stroke="#8A5A0A" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M2.8 21H21.2" stroke="#8A5A0A" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="step-text">A equipe confirma o<br>atendimento com você.</div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="cta-pill">
        <span class="cta-dot"></span>
        <span class="cta-text">CHAME A JS GRÁFICA NO WHATSAPP</span>
      </div>
      <div class="footer-row">
        <svg class="footer-logo" viewBox="0 0 24 24">
          <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
        </svg>
        <span class="footer-word">JS GRÁFICA · IBURA, RECIFE</span>
      </div>
    </div>
  </div>
</x-dc>
</body>
</html>
