<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P2-09, Impressão em papel cartão</title>
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--azul-sistema-escuro);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:80px;left:80px;right:80px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1.18;
    color:var(--branco-base);
  }
  .baralho{
    position:absolute;left:50%;top:270px;transform:translateX(-50%);
    width:560px;height:440px;
  }
  .cartao{
    position:absolute;width:240px;height:340px;
    border-radius:20px;
    background:var(--branco-base);
  }
  .cartao-tras{
    top:30px;left:40px;
    transform:rotate(-13deg);
    box-shadow:0 26px 46px rgba(0,0,0,0.30);
  }
  .cartao-frente{
    top:0;left:290px;
    transform:rotate(10deg);
    box-shadow:
      7px 7px 0 0 var(--azul-sistema-claro),
      14px 14px 0 0 var(--branco-gelo),
      0 30px 54px rgba(0,0,0,0.34);
  }
  .apoio{
    position:absolute;top:830px;left:130px;right:130px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--branco-gelo);
  }
  .cta{
    position:absolute;top:920px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:28px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:52px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:14px;
    background:var(--branco-base);
    border-radius:100px;
    padding:14px 28px;
  }
  .rodape-logo svg{width:46px;height:46px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">IMPRESSÃO EM<br>PAPEL CARTÃO</div>

  <div class="baralho">
    <div class="cartao cartao-tras"></div>
    <div class="cartao cartao-frente"></div>
  </div>

  <div class="apoio">Explique o material que você quer preparar.</div>

  <div class="cta">CONVERSE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir, sobre placa branca pra manter a cor oficial Azul Sistema legivel no fundo escuro; unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
