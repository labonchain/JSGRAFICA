<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P2-08, Impressão em papel couchê</title>
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:80px;left:0;width:1080px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:60px;line-height:1.15;
    color:var(--azul-sistema-escuro);
  }
  .pilha{
    position:absolute;top:246px;left:0;width:1080px;height:560px;
  }
  .folha{
    position:absolute;
    background:var(--azul-sistema-claro);
    border:2px solid var(--branco-base);
    border-radius:10px;
    box-shadow:0 26px 54px rgba(30,67,99,0.18);
    overflow:hidden;
  }
  .folha-brilho{
    position:absolute;top:-40px;left:58%;
    width:160px;height:620px;
    background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 48%, rgba(255,255,255,0) 92%);
    transform:rotate(16deg);
  }
  .folha-tras{
    width:420px;height:520px;
    top:20px;left:150px;
    transform:rotate(-8deg);
    background:var(--branco-base);
  }
  .folha-frente{
    width:440px;height:540px;
    top:0;left:470px;
    transform:rotate(6deg);
  }
  .apoio{
    position:absolute;top:838px;left:130px;width:820px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--grafite-traco);
  }
  .cta-pill{
    position:absolute;top:930px;left:0;right:0;width:760px;margin:0 auto;
    background:var(--azul-sistema-claro);
    border-radius:40px;
    padding:20px 0;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:26px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:44px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg{width:48px;height:48px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">IMPRESSÃO EM<br>PAPEL COUCHÊ</div>

  <div class="pilha">
    <div class="folha folha-tras"></div>
    <div class="folha folha-frente">
      <div class="folha-brilho"></div>
    </div>
  </div>

  <div class="apoio">Explique o material que você precisa.</div>

  <div class="cta-pill">CHAME A JS PARA ORIENTAÇÃO</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
