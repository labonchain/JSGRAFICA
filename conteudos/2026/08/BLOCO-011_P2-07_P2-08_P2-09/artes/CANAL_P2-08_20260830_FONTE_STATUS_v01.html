<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P2-08, Impressão em papel couchê</title>
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:170px;left:80px;right:80px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:70px;line-height:1.2;
    color:var(--azul-sistema-escuro);
  }
  .pilha{
    position:absolute;left:50%;top:520px;transform:translateX(-50%);
    width:640px;height:760px;
  }
  .folha{
    position:absolute;left:0;width:640px;height:210px;
    background:var(--azul-sistema-claro);
    border:3px solid var(--branco-base);
    border-radius:16px;
    box-shadow:0 20px 34px rgba(30,67,99,0.14);
    overflow:hidden;
  }
  .folha1{top:0;}
  .folha2{top:130px;}
  .folha3{top:260px;}
  .folha4{top:390px;}
  .folha-brilho{
    position:absolute;top:-140px;left:56%;
    width:220px;height:520px;
    background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.92) 48%, rgba(255,255,255,0) 92%);
    transform:rotate(20deg);
  }
  .apoio{
    position:absolute;top:1430px;left:130px;right:130px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:38px;line-height:1.55;
    color:var(--grafite-traco);
  }
  .cta-pill{
    position:absolute;top:1610px;left:0;right:0;width:820px;margin:0 auto;
    background:var(--azul-sistema-claro);
    border-radius:50px;
    padding:24px 0;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:32px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:120px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg{width:52px;height:52px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">IMPRESSÃO EM<br>PAPEL COUCHÊ</div>

  <div class="pilha">
    <div class="folha folha4"></div>
    <div class="folha folha3"></div>
    <div class="folha folha2"></div>
    <div class="folha folha1">
      <div class="folha-brilho"></div>
    </div>
  </div>

  <div class="apoio">Explique o material que você precisa.</div>

  <div class="cta-pill">CHAME A JS PARA ORIENTAÇÃO</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
