<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P2-07, Cadernos e materiais didáticos</title>
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:74px;left:80px;right:80px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1.18;
    color:var(--grafite-traco);
  }
  .area-principal{
    position:absolute;top:264px;left:190px;width:700px;height:520px;
    background:var(--azul-sistema-claro);
    border-radius:32px;
  }
  .pilha{
    position:absolute;left:50%;top:90px;transform:translateX(-50%);
    width:420px;height:360px;
  }
  .apostila{
    position:absolute;width:300px;height:320px;top:18px;left:20px;
    background:var(--branco-base);
    border:2px solid var(--cinza-nevoa);
    border-radius:12px;
    box-shadow:0 18px 34px rgba(30,67,99,0.16);
    transform:rotate(-9deg);
    padding:34px 30px;
  }
  .apostila .linha{
    height:9px;border-radius:5px;background:var(--cinza-nevoa);margin-bottom:24px;
  }
  .apostila .linha:nth-child(2){width:78%;}
  .apostila .linha:nth-child(3){width:60%;}
  .caderno{
    position:absolute;width:270px;height:330px;top:6px;left:110px;
    background:var(--azul-sistema);
    border-radius:8px 18px 18px 8px;
    box-shadow:0 24px 44px rgba(30,67,99,0.26);
    transform:rotate(6deg);
  }
  .espiral{
    position:absolute;left:-11px;top:20px;bottom:20px;width:22px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .anel{
    width:22px;height:22px;border-radius:50%;
    background:var(--branco-base);
    border:3px solid var(--grafite-traco);
  }
  .etiqueta-caderno{
    position:absolute;top:44px;left:50%;transform:translateX(-50%);
    width:150px;height:56px;
    background:var(--branco-base);
    border-radius:8px;
  }
  .apoio{
    position:absolute;top:824px;left:130px;right:130px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--grafite-traco);
  }
  .cta{
    position:absolute;top:918px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:28px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:50px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg{width:50px;height:50px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:29px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">MATERIAL PARA<br>ESTUDAR E ORGANIZAR</div>

  <div class="area-principal">
    <div class="pilha">
      <div class="apostila">
        <div class="linha"></div>
        <div class="linha"></div>
        <div class="linha"></div>
      </div>
      <div class="caderno">
        <div class="espiral">
          <div class="anel"></div>
          <div class="anel"></div>
          <div class="anel"></div>
          <div class="anel"></div>
          <div class="anel"></div>
          <div class="anel"></div>
        </div>
        <div class="etiqueta-caderno"></div>
      </div>
    </div>
  </div>

  <div class="apoio">Explique o que você precisa e a equipe orienta.</div>

  <div class="cta">FALE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
