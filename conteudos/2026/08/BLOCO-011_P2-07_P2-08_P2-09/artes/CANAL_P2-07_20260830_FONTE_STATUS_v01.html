<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P2-07, Cadernos e materiais didáticos</title>
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--azul-sistema-escuro);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:180px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:68px;line-height:1.2;
    color:var(--branco-base);
  }
  .pilha{
    position:absolute;left:50%;top:560px;transform:translateX(-50%);
    width:640px;height:560px;
  }
  .apostila{
    position:absolute;width:460px;height:500px;top:30px;left:20px;
    background:var(--branco-base);
    border:3px solid var(--cinza-nevoa);
    border-radius:20px;
    box-shadow:0 30px 56px rgba(0,0,0,0.32);
    transform:rotate(-9deg);
    padding:56px 48px;
  }
  .apostila .linha{
    height:15px;border-radius:8px;background:var(--cinza-nevoa);margin-bottom:38px;
  }
  .apostila .linha:nth-child(2){width:78%;}
  .apostila .linha:nth-child(3){width:60%;}
  .caderno{
    position:absolute;width:420px;height:520px;top:10px;left:170px;
    background:var(--azul-sistema);
    border-radius:14px 30px 30px 14px;
    box-shadow:0 36px 64px rgba(0,0,0,0.36);
    transform:rotate(6deg);
  }
  .espiral{
    position:absolute;left:-18px;top:32px;bottom:32px;width:36px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .anel{
    width:36px;height:36px;border-radius:50%;
    background:var(--branco-base);
    border:5px solid var(--azul-sistema-escuro);
  }
  .etiqueta-caderno{
    position:absolute;top:70px;left:50%;transform:translateX(-50%);
    width:230px;height:86px;
    background:var(--branco-base);
    border-radius:12px;
  }
  .apoio{
    position:absolute;top:1420px;left:130px;right:130px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:38px;line-height:1.55;
    color:var(--branco-gelo);
  }
  .cta{
    position:absolute;top:1590px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:34px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:150px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:16px;
    background:var(--branco-base);
    border-radius:100px;
    padding:16px 32px;
  }
  .rodape-logo svg{width:56px;height:56px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">MATERIAL PARA<br>ESTUDAR E ORGANIZAR</div>

  <div class="pilha">
    <div class="apostila">
      <div class="linha"></div>
      <div class="linha"></div>
      <div class="linha"></div>
    </div>
    <div class="caderno">
      <div class="espiral">
        <div class="anel"></div>
        <div class="anel"></div>
        <div class="anel"></div>
        <div class="anel"></div>
        <div class="anel"></div>
        <div class="anel"></div>
      </div>
      <div class="etiqueta-caderno"></div>
    </div>
  </div>

  <div class="apoio">Explique o que você precisa e a equipe orienta.</div>

  <div class="cta">FALE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir, sobre placa branca pra manter a cor oficial Azul Sistema legivel no fundo escuro; unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
