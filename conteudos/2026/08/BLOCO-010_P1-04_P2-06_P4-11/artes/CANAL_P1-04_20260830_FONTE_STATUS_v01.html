<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P1-04, Atendimento próximo no Ibura</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--azul-sistema);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .conteudo-seguro{
    position:absolute;top:260px;left:0;right:0;bottom:300px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:56px;
    padding:0 100px;
  }
  .icone-local{
    flex:none;
    width:260px;height:260px;border-radius:50%;
    background:var(--branco-base);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 30px rgba(17,38,58,0.22);
  }
  .icone-local svg{width:128px;height:128px;}
  .bloco-titulo{
    flex:none;
    background:var(--branco-base);
    border-radius:32px;
    padding:44px 56px;
    text-align:center;
    box-shadow:0 12px 30px rgba(17,38,58,0.18);
  }
  .bloco-titulo .titulo{
    font-family:var(--font-display);font-weight:700;font-size:58px;line-height:1.24;
    color:var(--grafite-traco);
    text-transform:uppercase;
  }
  .apoio{
    flex:none;
    text-align:center;
    font-family:var(--font-corpo);font-weight:600;font-size:38px;line-height:1.4;
    color:var(--branco-base);
  }
  .cta-pill{
    flex:none;
    background:var(--branco-base);
    border-radius:100px;
    padding:30px 56px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:30px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
    box-shadow:0 12px 30px rgba(17,38,58,0.18);
  }
  .rodape-logo{
    flex:none;
    display:flex;justify-content:center;align-items:center;gap:16px;
  }
  .rodape-logo svg{width:52px;height:52px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:0.5px;
    color:var(--branco-base);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="conteudo-seguro">
    <!-- pictograma proprio de ponto de localizacao (pin com furo), traco monolinear 2px, sem mapa e sem endereco -->
    <div class="icone-local">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--azul-sistema)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8.7 2 6 4.7 6 8c0 4.6 6 13 6 13s6-8.4 6-13c0-3.3-2.7-6-6-6z"/>
        <circle cx="12" cy="8" r="2.4"/>
      </svg>
    </div>

    <div class="bloco-titulo">
      <div class="titulo">ATENDIMENTO<br>PRÓXIMO, NO IBURA</div>
    </div>

    <div class="apoio">Pelo WhatsApp<br>ou no balcão.</div>

    <div class="cta-pill">FALE COM A JS GRÁFICA</div>

    <div class="rodape-logo">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#FFFFFF"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
