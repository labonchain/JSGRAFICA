<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P2-06, Revelação de fotos para guardar lembranças</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:64px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:46px;letter-spacing:1px;
    color:var(--grafite-traco);
  }
  .subtitulo{
    position:absolute;top:132px;left:140px;right:140px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:22px;line-height:1.4;
    color:var(--grafite-nevoa);
  }
  .molduras{
    position:absolute;top:246px;left:0;right:0;height:610px;
  }
  .moldura{
    position:absolute;
    width:250px;height:284px;
    background:var(--branco-base);
    border-radius:6px;
    padding:14px 14px 46px 14px;
    box-shadow:0 12px 26px rgba(30,67,99,0.14);
  }
  .moldura-interna{
    width:100%;height:100%;
    border-radius:3px;
    background:var(--azul-sistema-claro);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .moldura-interna svg{width:76px;height:76px;}
  .ponto{
    position:absolute;width:8px;height:8px;border-radius:50%;
    background:var(--amarelo-aviso-escuro);
  }
  .cta{
    position:absolute;top:918px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:30px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:56px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg{width:48px;height:48px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">REVELAÇÃO DE FOTOS</div>
  <div class="subtitulo">Converse com a equipe sobre o seu pedido.</div>

  <div class="molduras">
    <!-- Moldura 1: paisagem abstrata (montanha + sol), Azul Sistema, sem rosto, sem pessoa -->
    <div class="moldura" style="left:120px;top:20px;transform:rotate(-6deg);">
      <div class="moldura-interna">
        <svg viewBox="0 0 48 48" fill="none" stroke="var(--azul-sistema)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="34" cy="13" r="6"/>
          <path d="M4 38 L17 20 L25 30 L32 21 L44 38 Z"/>
        </svg>
      </div>
    </div>

    <!-- Moldura 2: estrela abstrata, Grafite Traco -->
    <div class="moldura" style="left:415px;top:0px;transform:rotate(4deg);">
      <div class="moldura-interna">
        <svg viewBox="0 0 48 48" fill="none" stroke="var(--grafite-traco)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 6 L28.5 19 L42 19 L31 27.5 L35 41 L24 32.5 L13 41 L17 27.5 L6 19 L19.5 19 Z"/>
        </svg>
      </div>
    </div>

    <!-- Moldura 3: vazia, so os 4 pontos de canto do sistema (grade da marca), nenhum icone dentro -->
    <div class="moldura" style="left:710px;top:34px;transform:rotate(-3deg);">
      <div class="moldura-interna">
        <div class="ponto" style="top:16px;left:16px;"></div>
        <div class="ponto" style="top:16px;right:16px;"></div>
        <div class="ponto" style="bottom:16px;left:16px;"></div>
        <div class="ponto" style="bottom:16px;right:16px;"></div>
      </div>
    </div>

    <!-- Moldura 4: onda abstrata, Azul Sistema Escuro -->
    <div class="moldura" style="left:266px;top:332px;transform:rotate(5deg);">
      <div class="moldura-interna">
        <svg viewBox="0 0 48 48" fill="none" stroke="var(--azul-sistema-escuro)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 26 C12 14,18 38,24 26 S36 14,42 26"/>
          <path d="M6 34 C12 22,18 46,24 34 S36 22,42 34"/>
        </svg>
      </div>
    </div>

    <!-- Moldura 5: vazia com grafismo de contorno pontilhado, Amarelo Aviso Escuro (contraste 4.75:1 contra Azul Sistema Claro, calculado, acima do minimo 3:1 pra elemento grafico; Laranja Pessego Escuro foi testado e descartado por ficar em 2.92:1, abaixo do minimo) -->
    <div class="moldura" style="left:560px;top:340px;transform:rotate(-4deg);">
      <div class="moldura-interna">
        <svg viewBox="0 0 48 48" fill="none" stroke="var(--amarelo-aviso-escuro)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="10" width="32" height="28" rx="3" stroke-dasharray="4 5"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="cta">CHAME A JS GRÁFICA</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
