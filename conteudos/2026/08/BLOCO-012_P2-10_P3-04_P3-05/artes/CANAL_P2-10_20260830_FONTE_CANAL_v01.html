<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P2-10, Papel adesivo para o seu pedido</title>
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:78px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1.18;
    color:var(--grafite-traco);
  }
  .area-principal{
    position:absolute;top:290px;left:190px;width:700px;height:470px;
    background:var(--azul-sistema-claro);
    border-radius:32px;
  }
  /* pictograma: folha adesiva neutra com contorno de corte tracejado, sem marca/preco/medida */
  .etiqueta-corte{
    position:absolute;left:50%;top:110px;transform:translateX(-50%) rotate(-4deg);
    width:280px;height:210px;
    border:3px dashed var(--laranja-pessego-escuro);
    border-radius:26px;
  }
  .etiqueta{
    position:absolute;left:50%;top:130px;transform:translateX(-50%) rotate(-4deg);
    width:236px;height:172px;
    background:var(--branco-base);
    border:3px solid var(--grafite-traco);
    border-radius:16px;
    overflow:hidden;
  }
  .etiqueta-dobra{
    position:absolute;top:0;right:0;
    width:0;height:0;
    border-style:solid;
    border-width:0 46px 46px 0;
    border-color:transparent var(--cinza-nevoa) transparent transparent;
  }
  .etiqueta-dobra-linha{
    position:absolute;top:0;right:0;
    width:0;height:0;
    border-style:solid;
    border-width:0 46px 46px 0;
    border-color:transparent transparent transparent transparent;
    border-right:2px solid var(--grafite-traco);
  }
  .ponto-adesivo{
    position:absolute;border-radius:50%;
  }
  .apoio{
    position:absolute;top:820px;left:140px;right:140px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--grafite-traco);
  }
  .cta{
    position:absolute;top:918px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:28px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:54px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg{width:52px;height:52px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">PAPEL ADESIVO<br>PARA O SEU PEDIDO</div>

  <div class="area-principal">
    <div class="etiqueta-corte"></div>
    <div class="etiqueta">
      <div class="etiqueta-dobra"></div>
    </div>
    <div class="ponto-adesivo" style="width:26px;height:26px;left:340px;top:340px;background:var(--amarelo-aviso-escuro);"></div>
    <div class="ponto-adesivo" style="width:18px;height:18px;right:150px;top:120px;background:var(--azul-sistema);"></div>
  </div>

  <div class="apoio">Explique o que você precisa e a equipe orienta.</div>

  <div class="cta">FALE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
