<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P3-04, Ajuda para consultar ou imprimir</title>
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  :root{
    --azul-sistema-escuro:#1E4363;
    --grafite-traco:#3A3A3A;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--azul-sistema-escuro);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:190px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:60px;line-height:1.2;
    color:var(--branco-base);
  }
  /* pictograma central, documento + lupa em escala grande, sem texto legivel ou interface real */
  .documento{
    position:absolute;left:410px;top:660px;
    width:400px;height:510px;
    background:var(--branco-base);
    border:5px solid var(--branco-base);
    border-radius:26px;
    overflow:hidden;
  }
  .documento-dobra{
    position:absolute;top:0;right:0;
    width:0;height:0;
    border-style:solid;
    border-width:0 76px 76px 0;
    border-color:transparent var(--cinza-nevoa) transparent transparent;
  }
  .documento-linha{
    position:absolute;left:46px;right:46px;height:18px;
    background:var(--cinza-nevoa);
    border-radius:9px;
  }
  .lupa{
    position:absolute;left:250px;top:1000px;
    width:200px;height:200px;
    border:18px solid var(--branco-base);
    border-radius:50%;
    background:var(--azul-sistema-escuro);
  }
  .lupa-cabo{
    position:absolute;left:400px;top:1170px;
    width:126px;height:28px;
    background:var(--branco-base);
    border-radius:14px;
    transform:rotate(45deg);
    transform-origin:left center;
  }
  .apoio{
    position:absolute;top:1440px;left:130px;right:130px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:36px;line-height:1.5;
    color:var(--branco-gelo);
  }
  .cta{
    position:absolute;top:1590px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:32px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:150px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:16px;
    background:var(--branco-base);
    border-radius:100px;
    padding:16px 32px;
  }
  .rodape-logo svg{width:56px;height:56px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">AJUDA PARA CONSULTAR<br>OU IMPRIMIR</div>

  <div class="documento">
    <div class="documento-dobra"></div>
    <div class="documento-linha" style="top:150px;"></div>
    <div class="documento-linha" style="top:206px;width:60%;"></div>
    <div class="documento-linha" style="top:310px;"></div>
    <div class="documento-linha" style="top:366px;width:70%;"></div>
    <div class="documento-linha" style="top:422px;width:45%;"></div>
  </div>
  <div class="lupa-cabo"></div>
  <div class="lupa"></div>

  <div class="apoio">Explique o que você precisa e a equipe orienta.</div>

  <div class="cta">FALE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir, sobre placa branca pra manter a cor oficial Azul Sistema legivel no fundo escuro; unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
