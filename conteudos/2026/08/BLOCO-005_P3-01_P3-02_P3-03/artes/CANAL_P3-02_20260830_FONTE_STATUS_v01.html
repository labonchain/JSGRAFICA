<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Status, P3-02, Recarga de celular e VEM</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1920px;
    background:var(--azul-sistema-escuro);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:170px;left:0;right:0;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:70px;line-height:1.18;
    color:var(--branco-base);
  }
  .pictogramas{
    position:absolute;top:420px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:36px;
  }
  .card-pict{
    width:520px;height:300px;
    background:var(--branco-base);
    border-radius:28px;
    box-shadow:0 22px 46px rgba(0,0,0,0.26);
    display:flex;align-items:center;justify-content:center;gap:44px;
  }
  .icone-celular{
    width:104px;height:184px;
    border:3px solid var(--grafite-traco);
    border-radius:20px;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:14px;
  }
  .icone-celular .tela{
    width:100%;height:100%;
    background:var(--azul-sistema-claro);
    border-radius:8px;
  }
  .icone-celular .botao{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    width:14px;height:14px;border-radius:50%;
    background:var(--grafite-traco);
  }
  .icone-cartao{
    width:220px;height:140px;
    background:var(--azul-sistema-claro);
    border:3px solid var(--azul-sistema);
    border-radius:16px;
    position:relative;
    overflow:hidden;
  }
  .icone-cartao .tarja{
    position:absolute;top:0;left:0;right:0;height:28px;
    background:var(--amarelo-aviso-escuro);
  }
  .icone-cartao .chip{
    position:absolute;top:56px;left:22px;
    width:30px;height:24px;border-radius:5px;
    background:var(--azul-sistema-escuro);
  }
  .icone-cartao .linha1{
    position:absolute;bottom:26px;right:22px;
    width:66px;height:9px;border-radius:4px;
    background:var(--grafite-nevoa);
  }
  .icone-cartao .linha2{
    position:absolute;bottom:12px;right:22px;
    width:44px;height:9px;border-radius:4px;
    background:var(--grafite-nevoa);
    opacity:0.55;
  }
  .label-pict{
    position:absolute;bottom:20px;left:0;right:0;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:20px;letter-spacing:2px;
    color:var(--grafite-traco);
  }
  .card-pict{position:relative;}
  .apoio{
    position:absolute;top:1400px;left:120px;right:120px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:36px;line-height:1.5;
    color:var(--branco-gelo);
  }
  .cta{
    position:absolute;top:1560px;left:90px;right:90px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:30px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:150px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:16px;
    background:var(--branco-base);
    border-radius:100px;
    padding:16px 32px;
  }
  .rodape-logo svg{width:56px;height:56px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">RECARGA PARA<br>SEGUIR O DIA.</div>

  <div class="pictogramas">
    <div class="card-pict">
      <div class="icone-celular">
        <div class="tela"></div>
        <div class="botao"></div>
      </div>
      <span style="font-family:var(--font-dado);font-weight:500;font-size:22px;letter-spacing:2px;color:var(--grafite-traco);">CELULAR</span>
    </div>
    <div class="card-pict">
      <div class="icone-cartao">
        <div class="tarja"></div>
        <div class="chip"></div>
        <div class="linha1"></div>
        <div class="linha2"></div>
      </div>
      <span style="font-family:var(--font-dado);font-weight:500;font-size:22px;letter-spacing:2px;color:var(--grafite-traco);">VEM</span>
    </div>
  </div>

  <div class="apoio">Recarga de celular e VEM na JS Gráfica.</div>

  <div class="cta">CONFIRME COM A EQUIPE PELO WHATSAPP</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir, sobre placa branca pra manter a cor oficial Azul Sistema legivel no fundo escuro; unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
