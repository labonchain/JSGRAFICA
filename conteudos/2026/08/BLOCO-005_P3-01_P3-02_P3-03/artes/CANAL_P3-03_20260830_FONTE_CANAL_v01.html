<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P3-03, Agendamentos</title>
<script src="./support.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego:#E8935A;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--azul-sistema);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .titulo{
    position:absolute;top:88px;left:0;right:0;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1.18;
    color:var(--branco-base);
  }
  .calendario{
    position:absolute;top:280px;left:260px;
    width:560px;height:480px;
    background:var(--branco-base);
    border-radius:24px;
    box-shadow:0 22px 46px rgba(15,35,55,0.28);
  }
  .anel{
    position:absolute;top:-16px;width:26px;height:46px;
    background:var(--azul-sistema-escuro);
    border-radius:8px;
  }
  .anel.esq{left:120px;}
  .anel.dir{right:120px;}
  .cal-header{
    position:absolute;top:0;left:0;right:0;height:64px;
    background:var(--azul-sistema);
    border-radius:24px 24px 0 0;
  }
  .cal-grid{
    position:absolute;top:96px;left:32px;right:32px;bottom:32px;
    display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:14px;
  }
  .cal-cell{
    background:var(--azul-sistema-claro);
    border-radius:10px;
  }
  .cal-cell.selecionada{
    background:var(--branco-base);
    border:3px solid var(--amarelo-aviso-escuro);
    position:relative;
  }
  .cursor{
    position:absolute;
    width:34px;height:34px;
  }
  .selo-verificacao{
    position:absolute;top:-32px;right:-32px;
    width:100px;height:100px;border-radius:50%;
    background:var(--azul-sistema-escuro);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 22px rgba(30,67,99,0.35);
  }
  .selo-verificacao svg{width:46px;height:46px;}
  .apoio{
    position:absolute;top:800px;left:80px;width:920px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--branco-base);
  }
  .cta{
    position:absolute;top:898px;left:80px;width:920px;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:26px;letter-spacing:1.5px;
    color:var(--amarelo-aviso);
  }
  .rodape-logo{
    position:absolute;bottom:56px;left:0;right:0;
    display:flex;justify-content:center;
  }
  .rodape-logo-placa{
    display:flex;align-items:center;gap:14px;
    background:var(--branco-base);
    border-radius:100px;
    padding:14px 28px;
  }
  .rodape-logo svg{width:48px;height:48px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="titulo">VAMOS ORGANIZAR<br>SEU AGENDAMENTO.</div>

  <div class="calendario">
    <div class="anel esq"></div>
    <div class="anel dir"></div>
    <div class="cal-header"></div>
    <div class="cal-grid">
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
      <div class="cal-cell selecionada">
        <!-- cursor/ponteiro generico, sem data ou horario real -->
        <svg class="cursor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;bottom:-14px;right:-12px;">
          <path d="M4 3 L4 19 L8.2 15.2 L11 21 L13.6 19.8 L10.8 14 L16 13.6 Z" fill="#3A3A3A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
      <div class="cal-cell"></div>
    </div>
    <div class="selo-verificacao">
      <!-- marca de verificacao generica, sem orgao, tela ou dado real -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12.5L10 17.5L19 7" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="apoio">Explique o que precisa e fale com a equipe.</div>

  <div class="cta">CHAME A JS GRÁFICA NO WHATSAPP</div>

  <div class="rodape-logo">
    <div class="rodape-logo-placa">
      <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), sem recolorir, sobre placa branca pra manter a cor oficial Azul Sistema legivel no fundo azul da peca; unica aplicacao de marca da peca -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
      </svg>
      <span>JS GRÁFICA</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
