<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JS Gráfica, Canal, P1-03, O que você precisa hoje</title>
<script src="./support.js"></script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk.ttf') format('truetype-variations'), url('fonts/SpaceGrotesk.ttf') format('truetype');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/Inter.ttf') format('truetype-variations'), url('fonts/Inter.ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  :root{
    --azul-sistema:#2C5F8A;
    --azul-sistema-escuro:#1E4363;
    --azul-sistema-claro:#DCE8F0;
    --laranja-pessego-escuro:#C96E36;
    --grafite-traco:#3A3A3A;
    --grafite-nevoa:#6B6B6B;
    --cinza-nevoa:#E4E4E4;
    --branco-base:#FFFFFF;
    --branco-gelo:#F7F7F5;
    --amarelo-aviso:#F0B429;
    --amarelo-aviso-escuro:#8A5A0A;
    --font-display:'Space Grotesk','Segoe UI',Arial,sans-serif;
    --font-corpo:'Inter','Segoe UI',Arial,sans-serif;
    --font-dado:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#cccccc;}
  x-dc{display:block;}
  .canvas{
    width:1080px;height:1080px;
    background:var(--branco-gelo);
    position:relative;
    overflow:hidden;
    font-family:var(--font-corpo);
  }
  .faixa{
    position:absolute;top:0;left:0;width:1080px;height:320px;
    background:var(--azul-sistema);
    border-radius:0 0 64px 64px;
  }
  .ponto{
    position:absolute;width:14px;height:14px;border-radius:50%;
    background:var(--amarelo-aviso);
  }
  .titulo{
    position:absolute;top:108px;left:80px;width:920px;
    text-align:center;
    font-family:var(--font-display);font-weight:700;font-size:66px;line-height:1.16;
    color:var(--branco-base);
  }
  .modulos{
    position:absolute;top:372px;left:60px;width:960px;height:260px;
    display:flex;justify-content:space-between;
  }
  .modulo{
    width:300px;height:252px;
    background:var(--branco-base);
    border:2px solid var(--cinza-nevoa);
    border-radius:20px;
    position:relative;
    padding:40px 24px 0 24px;
    text-align:center;
  }
  .modulo .ponto{top:20px;right:20px;}
  .modulo svg{width:76px;height:76px;}
  .modulo-label{
    margin-top:28px;
    font-family:var(--font-display);font-weight:500;font-size:32px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
  .modulo-numero{
    position:absolute;bottom:24px;left:0;right:0;
    font-family:var(--font-dado);font-weight:400;font-size:20px;letter-spacing:2px;
    color:var(--grafite-nevoa);
  }
  .apoio{
    position:absolute;top:684px;left:130px;width:820px;
    text-align:center;
    font-family:var(--font-corpo);font-weight:400;font-size:30px;line-height:1.5;
    color:var(--grafite-traco);
  }
  .cta-pill{
    position:absolute;top:794px;left:0;right:0;width:640px;margin:0 auto;
    background:var(--azul-sistema-claro);
    border-radius:40px;
    padding:20px 0;
    text-align:center;
    font-family:var(--font-dado);font-weight:500;font-size:27px;letter-spacing:1.5px;
    color:var(--azul-sistema-escuro);
  }
  .rodape-logo{
    position:absolute;bottom:88px;left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:14px;
  }
  .rodape-logo svg{width:48px;height:48px;}
  .rodape-logo span{
    font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:0.5px;
    color:var(--grafite-traco);
  }
</style>
</head>
<body>
<x-dc>
<div class="canvas">
  <div class="faixa">
    <div class="ponto" style="top:24px;left:24px;"></div>
    <div class="ponto" style="top:24px;right:24px;"></div>
    <div class="ponto" style="bottom:24px;left:24px;"></div>
    <div class="ponto" style="bottom:24px;right:24px;"></div>
  </div>

  <div class="titulo">O QUE VOCÊ<br>PRECISA HOJE?</div>

  <div class="modulos">
    <div class="modulo">
      <div class="ponto"></div>
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="13" y="9" width="30" height="40" rx="4" transform="rotate(-7 28 29)" fill="#FFFFFF" stroke="#2C5F8A" stroke-width="3"/>
        <rect x="20" y="13" width="30" height="40" rx="4" fill="#FFFFFF" stroke="#2C5F8A" stroke-width="3"/>
        <line x1="26" y1="24" x2="44" y2="24" stroke="#2C5F8A" stroke-width="3" stroke-linecap="round"/>
        <line x1="26" y1="32" x2="44" y2="32" stroke="#2C5F8A" stroke-width="3" stroke-linecap="round"/>
        <line x1="26" y1="40" x2="38" y2="40" stroke="#2C5F8A" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div class="modulo-label">IMPRIMIR</div>
    </div>

    <div class="modulo">
      <div class="ponto"></div>
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="12" y="12" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#C96E36" stroke-width="3"/>
        <path d="M23 39 L39 23 L43 27 L27 43 L21 45 Z" stroke="#C96E36" stroke-width="3" stroke-linejoin="round" fill="#FFFFFF"/>
      </svg>
      <div class="modulo-label">PERSONALIZAR</div>
    </div>

    <div class="modulo">
      <div class="ponto"></div>
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M14 16 h36 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 H30 l-10 10 v-10 h-6 a4 4 0 0 1 -4 -4 V20 a4 4 0 0 1 4 -4 Z" stroke="#1E4363" stroke-width="3" fill="#FFFFFF"/>
        <circle cx="24" cy="30" r="2.4" fill="#1E4363"/>
        <circle cx="32" cy="30" r="2.4" fill="#1E4363"/>
        <circle cx="40" cy="30" r="2.4" fill="#1E4363"/>
      </svg>
      <div class="modulo-label">ORIENTAR</div>
    </div>
  </div>

  <div class="apoio">A equipe orienta o atendimento no WhatsApp ou no balcão.</div>

  <div class="cta-pill">FALE COM A JS GRÁFICA</div>

  <div class="rodape-logo">
    <!-- logo-reducao.svg, aplicado literalmente (03-assets/logo/logo-reducao.svg), unica aplicacao de marca da peca -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M12 6 C15 6 17.5 8.3 17.5 11.3 C17.5 13 16.6 14.1 15.6 15.3 C14.9 16.1 14.5 16.9 14.5 17.8 L13.9 17.8 L13.9 20.2 L10.1 20.2 L10.1 17.8 L9.5 17.8 C9.5 16.9 9.1 16.1 8.4 15.3 C7.4 14.1 6.5 13 6.5 11.3 C6.5 8.3 9 6 12 6 Z" fill="#2C5F8A"/>
    </svg>
    <span>JS GRÁFICA</span>
  </div>
</div>
</x-dc>
</body>
</html>
